name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 Pillow PyInstaller

      - name: Create ICO
        shell: cmd
        run: |
          python -c "from PIL import Image; img=Image.open('1.png').convert('RGBA'); img.save('1.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build application
        shell: cmd
        run: |
          python -m PyInstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --windowed ^
            --name "PhoebeReminder" ^
            --icon "1.ico" ^
            --add-data "1.png;." ^
            --collect-all PySide6 ^
            "bot.py"

      - name: Build updater
        shell: cmd
        run: |
          python -m PyInstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --windowed ^
            --name "PhoebeReminder_Updater" ^
            "updater.py"

      - name: Verify build
        shell: cmd
        run: |
          if not exist "dist\PhoebeReminder.exe" exit /b 1
          if not exist "dist\PhoebeReminder_Updater.exe" exit /b 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PhoebeReminder.exe
            dist/PhoebeReminder_Updater.exe
          name: PhoebeReminder ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true